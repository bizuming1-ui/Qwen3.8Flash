<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#ffffff" />
    <title>界面1 · 生产看板</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div id="viewport">
      <div id="stage">
        <div class="card">
          <!-- 二维码：其他设备扫码进入同一块看板（多用户协同） -->
          <div id="qrbox" class="qr-box" title="扫码进入看板">
            <span class="qr-label mark">二维码</span>
            <img id="qr" class="qr-img" alt="扫码进入看板" decoding="async" />
          </div>

          <label class="lbl lbl-order mark" for="order">生产单</label>
          <input id="order" class="box box-order" type="text" autocomplete="off" spellcheck="false" />

          <label class="lbl lbl-product mark" for="product">产品</label>
          <input id="product" class="box box-product" type="text" autocomplete="off" spellcheck="false" />

          <label class="lbl lbl-current mark" for="current">当前生产数</label>
          <input id="current" class="box box-current" type="text" inputmode="numeric" autocomplete="off" />

          <label class="lbl lbl-total mark" for="total">生产总数</label>
          <input id="total" class="box box-total" type="text" readonly tabindex="-1" />

          <label class="lbl lbl-now mark" for="now">现在</label>
          <input id="now" class="box box-now" type="text" inputmode="numeric" autocomplete="off" />

          <button id="confirm" class="confirm mark" type="button">确认</button>
        </div>
      </div>
    </div>

    <!-- 点击二维码后的大图（默认隐藏，不影响与设计稿一致的首屏） -->
    <div id="qrModal" class="modal" hidden>
      <div class="modal-panel">
        <div class="modal-title">扫码进入同一块看板</div>
        <img id="qrBig" class="modal-qr" alt="二维码" />
        <div id="joinUrl" class="modal-url"></div>
        <div class="modal-actions">
          <button id="copyUrl" class="modal-btn" type="button">复制链接</button>
          <button id="closeModal" class="modal-btn" type="button">关闭</button>
        </div>
      </div>
    </div>

    <script src="/app.js" defer></script>
  </body>
</html>
