[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "qwen38flash-voice-clone-studio"
version = "0.1.0"
description = "Kaggle Voice Cloning System & Browser Experiment Simulator Studio with Real GitHub Sync"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "python-multipart>=0.0.9",
    "pydantic>=2.7.0",
    "numpy>=1.26.0",
    "scipy>=1.13.0",
    "soundfile>=0.12.1",
    "librosa>=0.10.2",
    "scikit-learn>=1.4.0",
    "matplotlib>=3.8.0",
    "nbformat>=5.10.0",
    "ipython>=8.20.0",
    "pandas>=2.2.0",
    "pyyaml>=6.0.1",
    "tqdm>=4.66.0",
    "psutil>=5.9.8",
    "imageio-ffmpeg>=0.5.1",
    "einops>=0.8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
